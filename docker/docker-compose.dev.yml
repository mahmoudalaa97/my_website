version: '3.8'

# Development Docker Compose - Only runs database and Redis
# Use this with local development servers (pnpm dev)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: website_postgres_dev
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-demo}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: website_redis_dev
    volumes:
      - redis_dev_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Admin UI (optional)
  adminer:
    image: adminer
    container_name: website_adminer_dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles:
      - with-adminer

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

