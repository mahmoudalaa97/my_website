events {
    worker_connections 1024;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # API Server - api.mahmoudalaa.com
    upstream api {
        server api:4000;
    }

    # Admin Dashboard - admin.mahmoudalaa.com
    upstream admin {
        server admin:3001;
    }

    # Web Frontend - demo.mahmoudalaa.com
    upstream web {
        server web:3000;
    }

    # API Server Configuration
    server {
        listen 80;
        server_name api.mahmoudalaa.com;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

    # Admin Dashboard Configuration
    server {
        listen 80;
        server_name admin.mahmoudalaa.com;

        location / {
            proxy_pass http://admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js specific
        location /_next/static {
            proxy_pass http://admin;
            proxy_cache_valid 200 60m;
        }
    }

    # Web Frontend Configuration
    server {
        listen 80;
        server_name demo.mahmoudalaa.com;

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js specific
        location /_next/static {
            proxy_pass http://web;
            proxy_cache_valid 200 60m;
        }
    }

    # Default server for localhost access (development/testing)
    server {
        listen 80 default_server;
        server_name localhost;

        # Root path shows available services
        location = / {
            default_type text/html;
            return 200 '<html><body><h1>My Website Services</h1><ul><li><a href="http://localhost:3000">Web (localhost:3000)</a></li><li><a href="http://localhost:3001">Admin (localhost:3001)</a></li><li><a href="http://localhost:4000">API (localhost:4000)</a></li></ul></body></html>';
        }

        # Proxy to web by default for localhost
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
