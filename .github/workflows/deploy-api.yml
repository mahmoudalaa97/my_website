name: Deploy API (Laravel)

on:
  push:
    branches: [main]
    paths:
      - "apps/api-php/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_DIR: apps/api-php
      REMOTE_DIR: ${{ secrets.HOSTINGER_API_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, bcmath, fileinfo, openssl, tokenizer, xml, ctype, json, curl
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('apps/api-php/composer.lock') }}
          restore-keys: composer-

      - name: Install production dependencies
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Stage deploy artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.backup' \
            --exclude='node_modules/' \
            --exclude='public/storage' \
            --exclude='public/build' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='tests/' \
            --exclude='.phpunit.cache/' \
            --exclude='.git*' \
            "${APP_DIR}/" dist/api/
          # Ship the prod env template so first-time setup has a reference.
          cp "${APP_DIR}/.env.production.example" dist/api/.env.production.example
          du -sh dist/api

      - name: Setup SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: bash .github/scripts/setup-hostinger-ssh.sh

      - name: Rsync to Hostinger
        env:
          REMOTE_DIR: ${{ secrets.HOSTINGER_API_DIR }}
        run: |
          set -euo pipefail
          source .github/scripts/normalize-remote-dir.sh
          REMOTE_DIR="$(normalize_remote_dir "$REMOTE_DIR")"
          [ -n "$REMOTE_DIR" ] || { echo "::error::HOSTINGER_API_DIR is empty"; exit 1; }
          echo "Remote path length: ${#REMOTE_DIR}"
          rsync -az --delete --human-readable \
            -e "ssh -F $HOME/.ssh/config" \
            dist/api/ \
            "hostinger:./${REMOTE_DIR}/"

      - name: Run post-deploy (migrate + caches)
        env:
          REMOTE_DIR: ${{ secrets.HOSTINGER_API_DIR }}
        run: |
          set -euo pipefail
          source .github/scripts/normalize-remote-dir.sh
          REMOTE_DIR="$(normalize_remote_dir "$REMOTE_DIR")"
          ssh -F "$HOME/.ssh/config" hostinger \
            "cd './${REMOTE_DIR}' && \
             php artisan migrate --force && \
             php artisan storage:link 2>/dev/null || true && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache"

      - name: Health check
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.API_HEALTH_URL }}" ]; then
            for i in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.API_HEALTH_URL }}")
              echo "attempt $i: $code"
              [ "$code" = "200" ] && exit 0
              sleep 3
            done
            echo "::error::health check failed after 5 tries"
            exit 1
          else
            echo "API_HEALTH_URL not set — skipping health check"
          fi
