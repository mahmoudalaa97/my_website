name: Deploy API (Laravel)

on:
  push:
    branches: [main]
    paths:
      - "apps/api-php/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, bcmath, fileinfo, openssl, tokenizer, xml, ctype, json, curl
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('apps/api-php/composer.lock') }}
          restore-keys: composer-

      - name: Install production dependencies
        working-directory: apps/api-php
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Stage deploy artifact
        run: |
          set -euo pipefail
          mkdir -p dist/api
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.backup' \
            --exclude='node_modules/' \
            --exclude='public/storage' \
            --exclude='public/build' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='tests/' \
            --exclude='.phpunit.cache/' \
            --exclude='.git*' \
            apps/api-php/ dist/api/
          cp apps/api-php/.env.production.example dist/api/.env.production.example
          du -sh dist/api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-api
          path: dist/api/
          retention-days: 1

  deploy:
    needs: build
    # Hostinger shared hosting blocks SSH from GitHub cloud IPs — deploy from your Mac.
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-api
          path: dist/api

      - name: Deploy to Hostinger
        env:
          HOSTINGER_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_USER: ${{ vars.HOSTINGER_SSH_USER }}
          HOSTINGER_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_API_DIR: ${{ secrets.HOSTINGER_API_DIR }}
          HOSTINGER_SSH_KEY_PATH: ${{ vars.HOSTINGER_SSH_KEY_PATH }}
        run: ./scripts/deploy-hostinger.sh api

      - name: Health check
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.API_HEALTH_URL }}" ]; then
            for i in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.API_HEALTH_URL }}")
              echo "attempt $i: $code"
              [ "$code" = "200" ] && exit 0
              sleep 3
            done
            echo "::error::health check failed after 5 tries"
            exit 1
          else
            echo "API_HEALTH_URL not set — skipping health check"
          fi
