name: Deploy Admin (Next.js)

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_NAME: admin
      APP_DIR: apps/admin
      REMOTE_DIR: ${{ secrets.HOSTINGER_ADMIN_DIR }}
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build admin (standalone)
        run: pnpm --filter @repo/admin build

      - name: Stage deploy artifact
        run: |
          set -euo pipefail
          OUT="dist/${APP_NAME}"
          rm -rf "$OUT" && mkdir -p "$OUT"
          # Standalone bundle is rooted at the monorepo root because of
          # outputFileTracingRoot — copy it as-is, then layer in the static
          # assets and public/ that standalone leaves out by design.
          cp -R "${APP_DIR}/.next/standalone/." "$OUT/"
          mkdir -p "$OUT/${APP_DIR}/.next"
          cp -R "${APP_DIR}/.next/static" "$OUT/${APP_DIR}/.next/static"
          if [ -d "${APP_DIR}/public" ]; then
            cp -R "${APP_DIR}/public" "$OUT/${APP_DIR}/public"
          fi
          # Top-level server.js shim — Hostinger's "Application startup file"
          # always points at server.js regardless of the monorepo path inside.
          printf "require('./%s/server.js');\n" "${APP_DIR}" > "$OUT/server.js"
          # Minimal package.json so Passenger sees a Node engine.
          cat > "$OUT/package.json" <<'JSON'
          {
            "name": "admin-hostinger",
            "private": true,
            "version": "1.0.0",
            "scripts": { "start": "node server.js" },
            "engines": { "node": ">=20" }
          }
          JSON
          du -sh "$OUT"

      - name: Setup SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: bash .github/scripts/setup-hostinger-ssh.sh

      - name: Rsync to Hostinger
        env:
          REMOTE_DIR: ${{ secrets.HOSTINGER_ADMIN_DIR }}
        run: |
          set -euo pipefail
          REMOTE_DIR="$(printf '%s' "$REMOTE_DIR" | tr -d '[:space:]')"
          [ -n "$REMOTE_DIR" ] || { echo "::error::HOSTINGER_ADMIN_DIR secret is empty"; exit 1; }
          rsync -az --delete --human-readable \
            -e "ssh -F $HOME/.ssh/config" \
            "dist/${APP_NAME}/" \
            "hostinger:./${REMOTE_DIR}/"

      - name: Restart Passenger
        env:
          REMOTE_DIR: ${{ secrets.HOSTINGER_ADMIN_DIR }}
        run: |
          set -euo pipefail
          REMOTE_DIR="$(printf '%s' "$REMOTE_DIR" | tr -d '[:space:]')"
          ssh -F "$HOME/.ssh/config" hostinger \
            "mkdir -p './${REMOTE_DIR}/tmp' && touch './${REMOTE_DIR}/tmp/restart.txt'"

      - name: Health check
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ADMIN_HEALTH_URL }}" ]; then
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.ADMIN_HEALTH_URL }}" || true)
              echo "attempt $i: $code"
              # 200 (login page) or 307 (redirect to /dashboard) both mean alive.
              case "$code" in 200|301|302|307|308) exit 0 ;; esac
              sleep 5
            done
            echo "::error::admin health check failed"
            exit 1
          else
            echo "ADMIN_HEALTH_URL not set — skipping health check"
          fi
