name: Deploy Admin (Next.js)

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build admin (standalone)
        run: pnpm --filter @repo/admin build

      - name: Stage deploy artifact
        run: |
          set -euo pipefail
          OUT="dist/admin"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp -R apps/admin/.next/standalone/. "$OUT/"
          mkdir -p "$OUT/apps/admin/.next"
          cp -R apps/admin/.next/static "$OUT/apps/admin/.next/static"
          if [ -d apps/admin/public ]; then
            cp -R apps/admin/public "$OUT/apps/admin/public"
          fi
          printf "require('./apps/admin/server.js');\n" > "$OUT/server.js"
          cat > "$OUT/package.json" <<'JSON'
          {
            "name": "admin-hostinger",
            "private": true,
            "version": "1.0.0",
            "scripts": { "start": "node server.js" },
            "engines": { "node": ">=20" }
          }
          JSON
          du -sh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-admin
          path: dist/admin/
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-admin
          path: dist/admin

      - name: Deploy to Hostinger
        env:
          HOSTINGER_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_USER: ${{ vars.HOSTINGER_SSH_USER }}
          HOSTINGER_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_ADMIN_DIR: ${{ secrets.HOSTINGER_ADMIN_DIR }}
          HOSTINGER_SSH_KEY_PATH: ${{ vars.HOSTINGER_SSH_KEY_PATH }}
        run: ./scripts/deploy-hostinger.sh admin

      - name: Health check
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ADMIN_HEALTH_URL }}" ]; then
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.ADMIN_HEALTH_URL }}" || true)
              echo "attempt $i: $code"
              case "$code" in 200|301|302|307|308) exit 0 ;; esac
              sleep 5
            done
            echo "::error::admin health check failed"
            exit 1
          else
            echo "ADMIN_HEALTH_URL not set — skipping health check"
          fi
