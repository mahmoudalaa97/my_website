name: Test Hostinger SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check config (no secrets printed)
        run: |
          set -euo pipefail
          echo "HOSTINGER_SSH_HOST var length: ${#HOSTINGER_SSH_HOST}"
          echo "HOSTINGER_SSH_USER var length: ${#HOSTINGER_SSH_USER}"
          echo "HOSTINGER_SSH_PORT var: ${HOSTINGER_SSH_PORT:-<empty>}"
          echo "HOSTINGER_SSH_KEY secret length: ${#HOSTINGER_SSH_KEY}"
          echo "Legacy HOSTINGER_HOST secret length: ${#HOSTINGER_HOST}"
          echo "Legacy HOSTINGER_USER secret length: ${#HOSTINGER_USER}"
          if [ ${#HOSTINGER_SSH_HOST} -eq 0 ] && [ ${#HOSTINGER_HOST} -eq 0 ]; then
            echo "::error::HOSTINGER_SSH_HOST is not set (Settings → Variables → HOSTINGER_SSH_HOST = 82.112.243.32)"
            exit 1
          fi
          if [ ${#HOSTINGER_SSH_USER} -eq 0 ] && [ ${#HOSTINGER_USER} -eq 0 ]; then
            echo "::error::HOSTINGER_SSH_USER is not set (Settings → Variables → HOSTINGER_SSH_USER = u661321560)"
            exit 1
          fi
          if [ ${#HOSTINGER_SSH_KEY} -lt 100 ]; then
            echo "::error::HOSTINGER_SSH_KEY looks too short — upload the full private key from ~/.ssh/id_ed25519_hostinger"
            exit 1
          fi
        env:
          HOSTINGER_SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}

      - name: Setup SSH and connect
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: bash .github/scripts/setup-hostinger-ssh.sh

      - name: Remote smoke test
        run: |
          ssh -F "$HOME/.ssh/config" hostinger 'echo connected && hostname && pwd && ls domains/ | head -5'
