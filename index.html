    <style>
        /* Loader styles */
        .loader {
            width: 50px;
            height: 50px;
            display: inline-block;
            position: relative;
        }
        
        .loader div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 44px;
            height: 44px;
            margin: 8px;
            border: 4px solid #007bff;
            border-radius: 50%;
            animation: loader 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #007bff transparent transparent transparent;
        }
        
        .loader div:nth-child(1) {
            animation-delay: -0.45s;
        }
        
        .loader div:nth-child(2) {
            animation-delay: -0.3s;
        }
        
        @keyframes loader {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .maintenance-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)), url('assets/images/home-bg-img1.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .maintenance-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(45, 45, 45, 0.7);
            z-index: -1;
        }
        
        .maintenance-content {
            background: rgba(30, 30, 30, 0.85);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            border-left: 4px solid #007bff;
        }
        
        .maintenance-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
            color: #007bff;
        }
        
        .maintenance-title {
            font-size: 36px;
            margin-bottom: 20px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .maintenance-message {
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.6;
            color: #ccc;
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .countdown-item {
            margin: 0 15px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            min-width: 80px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .countdown-number {
            font-size: 36px;
            font-weight: bold;
            color: #007bff;
        }
        
        .countdown-label {
            font-size: 14px;
            text-transform: uppercase;
            color: #aaa;
            margin-top: 5px;
        }
        
        .social-links {
            margin-top: 30px;
        }
        
        .social-links a {
            font-size: 24px;
            margin: 0 10px;
            color: #fff;
            transition: all 0.3s ease;
            display: inline-block;
            width: 50px;
            height: 50px;
            line-height: 50px;
            text-align: center;
            background: rgba(0, 123, 255, 0.2);
            border-radius: 50%;
        }
        
        .social-links a:hover {
            transform: translateY(-5px);
            background: rgba(0, 123, 255, 0.5);
            color: #fff;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            background-color: #dc3545;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
        
        @media (max-width: 768px) {
            .maintenance-title {
                font-size: 28px;
            }
            
            .maintenance-message {
                font-size: 16px;
            }
            
            .countdown-number {
                font-size: 28px;
            }
            
            .maintenance-content {
                padding: 25px 15px;
                width: 95%;
            }
            
            .countdown {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .countdown-item {

                min-width: 70px;
                padding: 10px;
            }
            
            .social-links a {

                height: 40px;
                line-height: 40px;
                font-size: 18px;
                margin: 0 5px;
            }

            }
            
            .maintenance-icon {
                font-size: 60px;
                margin-bottom: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .maintenance-title {
                font-size: 24px;
            }
            
            .countdown-number {

            }

                padding: 8px;
            }

            }

                For urgent inquiries, please contact: <a href="mailto:contact@mahmoudalaa.com" style="color: #007bff; text-decoration: none; border-bottom: 1px dotted #007bff;">contact@mahmoudalaa.com</a>

    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="assets/plugins/js/popper.min.js"></script>
    <script src="assets/plugins/js/bootstrap.min.js"></script>
    <script src="assets/plugins/js/wow.min.js"></script>
    
    <script>
        // Hide loader when page is loaded
        function hideLoader() {
            const loader = document.querySelector('.section-loader');
            if (loader) {
                loader.style.display = 'none';
            }
        }

        // Try to hide loader in multiple ways to ensure it works
        window.addEventListener('load', hideLoader);
        document.addEventListener('DOMContentLoaded', hideLoader);
        
        // Fallback: Hide loader after 5 seconds if it's still visible
        setTimeout(hideLoader, 5000);

        // Initialize WOW.js for animations
        new WOW().init();
        
        // Countdown timer - set the date to 7 days from now
        const countdownDate = new Date();
        countdownDate.setDate(countdownDate.getDate() + 30);
        
        // Update the countdown every second
        const countdown = setInterval(function() {
            const now = new Date().getTime();
            const distance = countdownDate - now;
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById("days").innerHTML = days.toString().padStart(2, '0');
            document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerHTML = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerHTML = seconds.toString().padStart(2, '0');
            
            if (distance < 0) {
                clearInterval(countdown);
                document.getElementById("days").innerHTML = "00";
                document.getElementById("hours").innerHTML = "00";
                document.getElementById("minutes").innerHTML = "00";
                document.getElementById("seconds").innerHTML = "00";
            }
        }, 1000);
        
        // Check for orientation change on mobile devices
        window.addEventListener('orientationchange', function() {
            // Small timeout to allow the orientation change to complete
            setTimeout(function() {
                // Force a reflow/repaint to handle any layout issues
                document.body.style.display = 'none';
                document.body.offsetHeight; // Trigger a reflow
                document.body.style.display = '';
            }, 100);
        });
    </script>
