[build]
builder = "nixpacks"

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
root = "apps/api"

[services.build]
buildCommand = "pnpm install && pnpm build"

[services.env]
NODE_ENV = "production"
PORT = "4000"

